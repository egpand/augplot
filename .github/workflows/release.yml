name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Check artifact names and contents
        run: |
          python - <<'PY'
          import tarfile
          import tomllib
          import zipfile
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          expected = {f"augplot-{version}-py3-none-any.whl", f"augplot-{version}.tar.gz"}
          actual = {path.name for path in Path("dist").iterdir() if path.is_file()}

          if len(wheels) != 1 or len(sdists) != 1 or actual != expected:
              raise SystemExit(f"Unexpected distribution artifacts: {sorted(actual)}")

          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_files = archive.namelist()
          with tarfile.open(sdists[0], "r:gz") as archive:
              sdist_files = archive.getnames()

          for filename in ("LICENSE", "NOTICE"):
              if not any(path.endswith(f".dist-info/licenses/{filename}") for path in wheel_files):
                  raise SystemExit(f"Wheel is missing {filename}")
              if not any(path.endswith(f"/{filename}") for path in sdist_files):
                  raise SystemExit(f"Source distribution is missing {filename}")
          PY

      - name: Install and import the wheel in a clean environment
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          WHEEL_PATH=$(realpath dist/*.whl)
          python -m venv /tmp/augplot-wheel
          /tmp/augplot-wheel/bin/python -m pip install "$WHEEL_PATH"
          cd /tmp
          AUGPLOT_EXPECTED_VERSION="$PACKAGE_VERSION" /tmp/augplot-wheel/bin/python -c 'import os, augplot; assert augplot.__version__ == os.environ["AUGPLOT_EXPECTED_VERSION"]'

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/augplot
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify downloaded artifacts
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Publish distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
