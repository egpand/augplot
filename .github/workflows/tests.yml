name: Tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest
        env:
          MPLBACKEND: Agg
      - run: python -m build
      - run: |
          python -m venv /tmp/augplot-wheel
          /tmp/augplot-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/augplot-wheel/bin/python -c "import augplot as ap; print(ap.plot)"

  minimum-dependencies:
    name: Minimum dependencies (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install minimum runtime and test dependencies
        run: |
          python -m pip install -e . \
            'numpy==1.26.0' \
            'pandas==2.1.0' \
            'matplotlib==3.8.0' \
            'seaborn==0.13.0' \
            'ipython==8.18.0' \
            'litellm==1.60.0' \
            'pytest==8.0.0' \
            'nbclient==0.10.0' \
            'nbformat==5.10.0' \
            'ipykernel==6.29.0'
      - run: python -m pytest
        env:
          MPLBACKEND: Agg
