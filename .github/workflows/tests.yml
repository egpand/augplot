name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,plotly]'
      - run: python -m ruff check .
      - run: python -m pytest
        env:
          MPLBACKEND: Agg
      - run: python -m build
      - run: |
          python -m venv /tmp/himalia-wheel
          /tmp/himalia-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/himalia-wheel/bin/python -c "from himalia import Visualizer; print(Visualizer())"
