[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "augplot"
version = "0.2.0"
description = "Turn notebook data into visualizations and reusable Python with an LLM."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Pavel Egorov" }]
requires-python = ">=3.11,<3.15"
keywords = ["data-visualization", "jupyter", "llm", "matplotlib", "seaborn"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Jupyter",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14",
  "ipython>=8.18,<10",
  "litellm>=1.60,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1.2", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]

[project.urls]
Repository = "https://github.com/egpand/augplot"
Documentation = "https://github.com/egpand/augplot/tree/main/docs"
Issues = "https://github.com/egpand/augplot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/augplot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: optional tests that call a configured LLM API"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
