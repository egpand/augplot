[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "augplot"
version = "0.1.0"
description = "Turn notebook data into visualizations and reusable Python with an LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14",
  "ipython>=8.18,<10",
  "litellm>=1.60,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1.2", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]

[tool.hatch.build.targets.wheel]
packages = ["src/augplot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: optional tests that call a configured LLM API"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
